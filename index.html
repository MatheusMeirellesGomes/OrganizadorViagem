<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#214e42" />
    <meta
      name="description"
      content="Seu mundo, suas viagens. Planeje cada caminho com liberdade."
    />
    <link rel="icon" type="image/png" href="/gomes-landscape-g.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Tema antes do primeiro desenho (mesma regra de src/theme.ts).
      (function () {
        var p = "auto";
        try { p = localStorage.getItem("gomes-tema") || "auto"; } catch (e) {}
        var dark = p === "dark" || (p !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <title>GOMES PELO MUNDO — viagens em família</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
